<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResenasMIXX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
<!--encabezado-->
    <header class="bg-slate-900 p-3 border-b border-slate-800 flex justify-between items-center">
        <a href="index.html" class="font-bold text-cyan-400">🎮 ResenasMIXX</a>
        <nav class="flex gap-3 text-sm">
            <a href="index.html" class="text-slate-400">Inicio</a>
            <a href="resenas.html" class="text-slate-400">Reseñas</a>
            <a href="login.html" class="text-cyan-400 font-bold">Login</a>
            <a href="registro.html" class="text-slate-400">Registro</a>
        </nav>
    </header>
<!--incio de sesion-->
    <main class="flex-grow flex items-center justify-center p-4">
        <form id="loginForm" class="bg-slate-900 border border-slate-800 p-5 rounded-lg w-full max-w-xs space-y-3" novalidate>
            <h1 class="text-lg font-bold text-center">Login</h1>
            
            <label for="loginEmail" class="sr-only">Correo</label>
            <input type="email" id="loginEmail" placeholder="Correo" autocomplete="email" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-xs">
            <span class="text-red-400 text-xs hidden" id="errLoginEmail"></span>

            <label for="loginPassword" class="sr-only">Contraseña</label>
            <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-xs">
            <span class="text-red-400 text-xs hidden" id="errLoginPassword"></span>

            <div id="loginStatus" class="text-center text-xs p-1.5 rounded hidden"></div>
            <button type="submit" class="w-full bg-cyan-500 text-slate-950 font-bold py-2 rounded text-xs">Ingresar</button>
        </form>
    </main>

    <footer class="p-3 text-center text-slate-600 text-xs">&copy; 2026 ResenasMIXX</footer>
    <script src="js/main.js"></script>
</body>
</html>
